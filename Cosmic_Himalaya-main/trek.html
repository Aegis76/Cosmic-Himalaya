<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Treks — Nepal Himalaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
/* =====================================================================
   DESIGN TOKENS  — merges safely with an existing :root
   Same var names as the source file, refined values.
   ===================================================================== */
:root{
  --navy:#16306b;
  --navy-deep:#0d1f47;
  --gold:#c6a662;
  --gold2:#a8843f;
  --gold3:#e3cd94;
  --teal:#0e7c73;
  --white:#ffffff;
  --light:#f5f6fa;
  --border:#e4e7f0;
  --text:#414a5e;
  --muted:#8a92a6;

  --ease:cubic-bezier(0.16,1,0.3,1);
  --ease-soft:cubic-bezier(0.4,0,0.2,1);
  --r-sm:10px; --r-md:14px; --r-lg:20px;
  --shadow-sm:0 2px 4px rgba(22,48,107,.04),0 8px 20px rgba(22,48,107,.06);
  --shadow-md:0 6px 12px rgba(22,48,107,.07),0 18px 40px rgba(22,48,107,.10);
  --shadow-lg:0 10px 20px rgba(22,48,107,.08),0 28px 56px rgba(22,48,107,.14);
  --mono:"Space Mono",ui-monospace,monospace;
  --serif:"Playfair Display",Georgia,serif;
  --sans:"Inter",system-ui,sans-serif;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;font-family:var(--sans);color:var(--text);
  background:var(--light);-webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%;}
button{font-family:inherit;}
a{color:inherit;}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px;}

/* utility eyebrow shared by several sections */
.eyebrow{
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:3px;
  text-transform:uppercase;color:var(--gold2);
}

/* =====================================================================
   TOP NAV (light chrome so the pages read as a real site)
   ===================================================================== */
.site-nav{
  position:sticky;top:0;z-index:200;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(18px,5vw,60px);
  background:rgba(255,255,255,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy);letter-spacing:.4px;}
.brand .mk{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--navy),var(--teal));color:var(--gold3);font-size:15px;}
.brand small{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:2px;font-weight:400;display:block;}
.nav-links{display:flex;gap:26px;font-size:14px;font-weight:600;color:var(--text);}
.nav-links a{text-decoration:none;position:relative;padding:4px 0;}
.nav-links a::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:100%;
  background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease);}
.nav-links a:hover::after{transform:scaleX(1);}
@media(max-width:720px){.nav-links{display:none;}}

/* =====================================================================
   VIEW SWITCHER (grid  <->  detail)
   ===================================================================== */
.view{display:none;}
.view.active{display:block;animation:panelFade .5s var(--ease) both;}

/* =====================================================================
   ALL-TREKS HERO
   ===================================================================== */
.all-treks-hero{
  height:480px;position:relative;display:flex;align-items:center;justify-content:center;
  text-align:center;overflow:hidden;
  background-image:url("https://images.unsplash.com/photo-1697012511691-52b2c14a133d?q=80&w=1600&auto=format&fit=crop");
  background-size:cover;background-position:center;
}
.all-treks-hero::before{content:"";position:absolute;inset:0;z-index:1;
  background:radial-gradient(120% 90% at 50% 0%,rgba(22,48,107,.15) 0%,rgba(22,48,107,.55) 55%,rgba(13,31,71,.86) 100%);}
/* faint topographic contour lines drawn over the hero — subject-true texture */
.all-treks-hero::after{content:"";position:absolute;inset:0;z-index:1;opacity:.14;mix-blend-mode:overlay;
  background-image:repeating-radial-gradient(ellipse 60% 50% at 68% 42%,transparent 0 22px,rgba(255,255,255,.7) 22px 23px);}
.at-hero-content{position:relative;z-index:10;max-width:820px;padding:0 20px;animation:atRise .9s var(--ease) both;}
@keyframes atRise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
.at-eyebrow{color:var(--gold3);margin-bottom:16px;}
.at-hero-content h1{
  font-family:var(--serif);font-size:clamp(40px,6vw,70px);color:var(--white);
  margin:0 0 18px;line-height:1.1;letter-spacing:-.5px;text-shadow:0 4px 30px rgba(0,0,0,.35);}
.at-hero-content h1 em{font-style:italic;color:var(--gold3);}
.at-hero-content p{color:rgba(255,255,255,.92);font-size:clamp(16px,2vw,20px);line-height:1.6;
  font-weight:500;max-width:600px;margin:0 auto;text-shadow:0 2px 14px rgba(0,0,0,.3);}

/* =====================================================================
   FILTER BAR + SEARCH
   ===================================================================== */
.trek-filter-bar{background:var(--white);padding:24px clamp(20px,5vw,60px);border-bottom:1px solid var(--border);
  position:sticky;top:64px;z-index:120;}
.filter-row{display:flex;align-items:center;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-icon{width:42px;height:42px;border-radius:50%;background:var(--navy);color:var(--white);
  display:grid;place-items:center;font-size:15px;flex-shrink:0;box-shadow:0 6px 16px rgba(22,48,107,.25);}
.ftab{padding:10px 20px;border-radius:999px;border:1.5px solid var(--border);background:transparent;
  font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;cursor:pointer;
  transition:color .25s var(--ease-soft),border-color .25s var(--ease-soft),background .25s var(--ease-soft),box-shadow .25s var(--ease-soft),transform .2s var(--ease);}
.ftab:hover{border-color:var(--gold);transform:translateY(-1px);}
.ftab.active{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700;box-shadow:0 6px 18px rgba(198,166,98,.35);}
.filter-search-wrap{position:relative;flex:1;min-width:220px;display:flex;align-items:center;}
.fs-ico{position:absolute;left:16px;color:var(--muted);font-size:15px;pointer-events:none;z-index:5;transition:color .25s var(--ease-soft);}
.trek-search-input{flex:1;width:100%;padding:14px 20px 14px 44px;border:1.5px solid var(--border);
  border-radius:var(--r-md);outline:none;font-family:var(--sans);font-size:16px;background:var(--white);
  transition:border-color .3s var(--ease-soft),box-shadow .3s var(--ease-soft);}
.trek-search-input::placeholder{color:var(--muted);}
.trek-search-input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(198,166,98,.14),0 8px 22px rgba(22,48,107,.06);}
.filter-search-wrap:focus-within .fs-ico{color:var(--gold);}
.search-row{overflow:visible!important;margin-bottom:14px;}

/* =====================================================================
   TREK GRID + CARDS
   ===================================================================== */
.treks-grid-section{padding:clamp(30px,5vw,56px) clamp(16px,4vw,40px);max-width:1320px;margin:0 auto;}
.grid-count{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:1px;margin:0 20px 18px;}
.grid-count b{color:var(--navy);}
.grid-layout{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:28px;padding:0 20px;align-items:stretch;}
.trek-card{border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border);
  background:var(--white);cursor:pointer;display:flex;flex-direction:column;height:100%;
  transition:transform .4s var(--ease),box-shadow .4s var(--ease),border-color .4s var(--ease);}
.trek-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:rgba(198,166,98,.4);}
.tk-img{height:212px;position:relative;overflow:hidden;flex-shrink:0;}
.tk-img img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease);}
.tk-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(13,31,71,.55) 0%,transparent 48%);}
.trek-card:hover .tk-img img{transform:scale(1.07);}
.tk-diff{position:absolute;top:12px;left:12px;z-index:2;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;color:var(--navy);background:var(--gold3);
  padding:5px 10px;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.18);}
.tk-loc{position:absolute;bottom:12px;left:12px;right:12px;z-index:2;color:var(--white);font-size:12px;font-weight:600;
  display:flex;align-items:center;gap:6px;text-shadow:0 2px 8px rgba(0,0,0,.4);}
.tk-body{padding:18px 18px 20px;display:flex;flex-direction:column;flex:1;}
.tk-title{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--navy);margin:0 0 12px;line-height:1.22;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:calc(1.22em * 2);}
.tk-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 8px;padding:12px 0;border-top:1px dashed var(--border);border-bottom:1px dashed var(--border);}
.tk-meta div{display:flex;flex-direction:column;gap:2px;}
.tk-meta .k{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
.tk-meta .v{font-size:13px;font-weight:700;color:var(--text);}
.tk-price{margin-top:14px;font-size:13px;color:var(--muted);display:flex;align-items:baseline;gap:6px;}
.tk-price b{font-family:var(--sans);color:var(--navy);font-size:20px;font-weight:800;letter-spacing:-.3px;}
.tk-price .req{font-size:14px;font-weight:700;color:var(--teal);}
.tk-btn{position:relative;width:100%;margin-top:auto;padding:12px;border:1.5px solid var(--navy);color:var(--navy);
  background:transparent;font-size:13px;font-weight:700;border-radius:var(--r-sm);letter-spacing:.3px;overflow:hidden;
  cursor:pointer;z-index:0;transition:color .3s var(--ease-soft);}
.tk-btn::before{content:"";position:absolute;inset:0;background:var(--navy);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease);z-index:-1;}
.tk-btn:hover{color:var(--gold3);}
.tk-btn:hover::before{transform:scaleX(1);}

/* NO RESULTS */
.no-results-msg{text-align:center;padding:80px 20px;background:var(--white);border-radius:var(--r-lg);
  border:1px solid var(--border);box-shadow:var(--shadow-sm);margin:40px auto;max-width:500px;}
.no-res-ico{font-size:56px;margin-bottom:16px;opacity:.85;}
.no-results-msg h3{font-family:var(--serif);font-size:28px;color:var(--navy);margin:0 0 12px;}
.no-results-msg p{color:var(--muted);font-size:16px;line-height:1.6;margin:0;}

/* =====================================================================
   TREK DETAILS — HERO
   ===================================================================== */
.trek-details-hero{height:540px;position:relative;display:flex;align-items:flex-end;padding:60px;color:var(--white);
  background-size:cover;background-position:center;}
.td-hero-overlay{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(13,31,71,.95) 12%,rgba(22,48,107,.5) 48%,transparent 84%);}
.td-hero-content{position:relative;z-index:2;max-width:1200px;margin:0 auto;width:100%;animation:atRise .9s var(--ease) both;}
.td-breadcrumbs{font-size:13px;margin-bottom:18px;color:rgba(255,255,255,.9);font-weight:500;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-shadow:0 2px 4px rgba(0,0,0,.3);}
.td-breadcrumbs a{color:rgba(255,255,255,.85);text-decoration:none;cursor:pointer;border-bottom:1px solid transparent;transition:color .3s,border-color .3s;}
.td-breadcrumbs a:hover{color:var(--gold3);border-bottom-color:var(--gold3);}
.td-breadcrumbs .cur{color:var(--gold3);font-weight:700;}
.td-hero-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.td-hero-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;font-weight:700;
  padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px);}
.td-hero-tag.gold{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.td-title-row h1{font-family:var(--serif);font-size:clamp(34px,5vw,56px);margin:0 0 8px;letter-spacing:-.5px;line-height:1.05;text-shadow:0 4px 24px rgba(0,0,0,.4);}
.td-title-row p{margin:0;font-size:16px;color:rgba(255,255,255,.9);display:flex;align-items:center;gap:8px;}

/* INFO STRIP */
.td-info-strip{background:var(--white);box-shadow:var(--shadow-md);border-radius:var(--r-lg);padding:26px 20px;
  display:flex;justify-content:space-around;margin:-60px auto 0;position:relative;z-index:10;max-width:1200px;border:1px solid rgba(0,0,0,.03);}
.td-qi{display:flex;align-items:center;gap:14px;padding:0 12px;border-right:1px solid var(--border);transition:transform .3s var(--ease);}
.td-qi:last-child{border-right:none;}
.td-qi:hover{transform:translateY(-3px);}
.qi-ico{font-size:26px;filter:drop-shadow(0 4px 8px rgba(22,48,107,.22));}
.qi-label{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:1.2px;margin-bottom:3px;}
.qi-val{font-size:16px;font-weight:800;color:var(--navy);}

/* =====================================================================
   MAIN LAYOUT
   ===================================================================== */
.td-main-layout{max-width:1200px;margin:56px auto;display:grid;grid-template-columns:1fr 372px;gap:48px;padding:0 20px;overflow-wrap:break-word;}
.td-left-col{min-width:0;width:100%;}

.td-tabs{display:flex;gap:34px;border-bottom:2px solid var(--border);margin-bottom:36px;position:sticky;top:64px;
  background:var(--light);z-index:100;padding-top:14px;}
.td-t{position:relative;padding:15px 0;font-size:14px;font-weight:700;color:var(--muted);background:none;border:none;
  cursor:pointer;letter-spacing:.4px;transition:color .3s var(--ease-soft);}
.td-t::after{content:"";position:absolute;left:0;bottom:-2px;height:4px;width:100%;background:var(--gold);
  border-radius:4px 4px 0 0;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease);}
.td-t.active{color:var(--navy);}
.td-t.active::after{transform:scaleX(1);}
.td-t:hover:not(.active){color:var(--navy);}

.td-panel{display:none;width:100%;overflow-x:hidden;}
.td-panel.active{display:block;animation:panelFade .45s var(--ease) both;}
@keyframes panelFade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.td-section-title{font-family:var(--serif);font-size:clamp(22px,4vw,28px);font-weight:700;color:var(--navy);
  margin:0 0 18px;display:flex;align-items:center;gap:12px;line-height:1.25;}
.td-section-title .num{font-family:var(--mono);font-size:13px;color:var(--gold2);font-weight:700;
  border:1.5px solid var(--gold3);border-radius:8px;padding:4px 8px;align-self:center;}
.td-text{font-size:16px;line-height:1.85;color:var(--text);margin-bottom:24px;}

.td-callout{display:flex;gap:14px;background:linear-gradient(180deg,rgba(14,124,115,.06),rgba(14,124,115,.02));
  border:1px solid rgba(14,124,115,.18);border-left:4px solid var(--teal);border-radius:var(--r-md);padding:16px 18px;margin-bottom:30px;}
.td-callout .ci{font-size:20px;flex-shrink:0;}
.td-callout .ct b{color:var(--teal);}
.td-callout .ct{font-size:14.5px;line-height:1.6;color:var(--text);}

/* Highlights */
.td-highlights-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:34px;}
.tdh-item{display:flex;align-items:flex-start;gap:14px;background:var(--light);padding:16px;border-radius:var(--r-md);
  border:1px solid rgba(0,0,0,.02);transition:transform .3s var(--ease),box-shadow .3s var(--ease),background .3s var(--ease);}
.tdh-item:hover{transform:translateY(-3px);background:var(--white);box-shadow:var(--shadow-sm);}
.tdh-ico{font-size:20px;flex-shrink:0;margin-top:1px;}
.tdh-txt{font-size:15px;font-weight:600;color:var(--text);line-height:1.5;}

/* carry chips */
.td-carry{display:flex;flex-wrap:wrap;gap:10px;}
.carry-chip{font-size:13px;font-weight:600;color:var(--navy);background:var(--white);border:1.5px solid var(--border);
  padding:9px 14px;border-radius:999px;display:flex;align-items:center;gap:7px;transition:border-color .25s,transform .25s;}
.carry-chip:hover{border-color:var(--gold);transform:translateY(-2px);}
.carry-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}

/* =====================================================================
   SIGNATURE — ALTITUDE RIDGELINE
   ===================================================================== */
.altitude-card{background:linear-gradient(180deg,var(--navy-deep),var(--navy));border-radius:var(--r-lg);
  padding:26px 24px 12px;margin-bottom:34px;color:var(--white);box-shadow:var(--shadow-md);position:relative;overflow:hidden;}
.altitude-card::before{content:"";position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.04) 39px 40px);}
.alt-head{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2;margin-bottom:8px;flex-wrap:wrap;gap:10px;}
.alt-head h3{font-family:var(--serif);font-size:22px;margin:0 0 4px;font-weight:700;}
.alt-head .sub{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--gold3);text-transform:uppercase;}
.alt-peak{text-align:right;}
.alt-peak .pv{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--gold3);}
.alt-peak .pl{font-size:11px;color:rgba(255,255,255,.6);letter-spacing:.5px;}
.alt-svg-wrap{position:relative;z-index:2;width:100%;overflow-x:auto;scrollbar-width:none;}
.alt-svg-wrap::-webkit-scrollbar{display:none;}
.alt-svg{display:block;width:100%;min-width:640px;height:230px;}
.alt-grid-line{stroke:rgba(255,255,255,.10);stroke-width:1;}
.alt-grid-label{fill:rgba(255,255,255,.45);font-family:var(--mono);font-size:9px;}
.alt-area{fill:url(#altGrad);}
.alt-line{fill:none;stroke:var(--gold3);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));}
.alt-dot{fill:var(--navy-deep);stroke:var(--gold3);stroke-width:2;cursor:pointer;transition:r .2s var(--ease),fill .2s;}
.alt-dot:hover,.alt-dot.hot{r:7;fill:var(--gold);}
.alt-dot.peak{fill:var(--gold);stroke:var(--white);}
.alt-daylabel{fill:rgba(255,255,255,.55);font-family:var(--mono);font-size:9px;text-anchor:middle;}
.alt-legend{position:relative;z-index:2;display:flex;gap:18px;flex-wrap:wrap;padding:8px 2px 6px;font-size:11px;color:rgba(255,255,255,.7);}
.alt-legend span{display:flex;align-items:center;gap:6px;}
.alt-legend i{width:14px;height:3px;border-radius:2px;background:var(--gold3);display:inline-block;}
.alt-legend i.peak{width:9px;height:9px;border-radius:50%;background:var(--gold);}

/* =====================================================================
   ITINERARY TIMELINE
   ===================================================================== */
.itin{position:relative;padding-left:8px;}
.itin-item{position:relative;padding:0 0 20px 46px;}
.itin-item::before{content:"";position:absolute;left:15px;top:6px;bottom:-6px;width:2px;background:var(--border);}
.itin-item:last-child::before{display:none;}
.itin-node{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;
  background:var(--white);border:2px solid var(--gold);color:var(--navy);font-family:var(--mono);font-weight:700;
  font-size:12px;display:grid;place-items:center;z-index:2;transition:transform .25s var(--ease),background .25s,color .25s,box-shadow .25s;}
.itin-item.rest .itin-node{border-color:var(--teal);color:var(--teal);}
.itin-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 18px;
  transition:border-color .25s var(--ease-soft),box-shadow .25s var(--ease-soft),transform .25s var(--ease-soft);cursor:default;}
.itin-item:hover .itin-card{border-color:rgba(198,166,98,.5);box-shadow:var(--shadow-sm);transform:translateX(3px);}
.itin-item:hover .itin-node{transform:scale(1.12);background:var(--gold);color:var(--navy);box-shadow:0 6px 16px rgba(198,166,98,.4);}
.itin-item.rest:hover .itin-node{background:var(--teal);color:var(--white);box-shadow:0 6px 16px rgba(14,124,115,.4);}
.itin-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;flex-wrap:wrap;}

.itin-badges{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;}
.itin-badge{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.5px;padding:4px 9px;border-radius:6px;white-space:nowrap;}
.itin-badge.alt{background:rgba(22,48,107,.08);color:var(--navy);}
.itin-badge.time{background:rgba(198,166,98,.16);color:var(--gold2);}
.itin-badge.rest{background:rgba(14,124,115,.12);color:var(--teal);}
.itin-points{list-style:none;margin:0;padding:0;display:grid;gap:6px;}
.itin-points li{position:relative;padding-left:18px;font-size:14px;color:var(--text);line-height:1.5;}
.itin-points li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--gold);}

/* =====================================================================
   INCLUSIONS / EXCLUSIONS
   ===================================================================== */
.ie-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:30px;}
.ie-col{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;}
.ie-col h4{font-family:var(--serif);font-size:19px;margin:0 0 16px;display:flex;align-items:center;gap:10px;color:var(--navy);}
.ie-col.inc h4 .badge{background:rgba(14,124,115,.12);color:var(--teal);}
.ie-col.exc h4 .badge{background:rgba(203,72,72,.12);color:#c0392b;}
.ie-col h4 .badge{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;}
.ie-list{list-style:none;margin:0;padding:0;display:grid;gap:11px;}
.ie-list li{position:relative;padding-left:28px;font-size:14.5px;line-height:1.55;color:var(--text);}
.ie-list li::before{position:absolute;left:0;top:0;font-size:15px;font-weight:700;}
.ie-col.inc .ie-list li::before{content:"✓";color:var(--teal);}
.ie-col.exc .ie-list li::before{content:"✕";color:#c0392b;font-size:13px;top:1px;}
.ie-list li b{color:var(--navy);}

.docs-note{background:var(--light);border:1px dashed var(--border);border-radius:var(--r-md);padding:18px 20px;}
.docs-note h5{margin:0 0 12px;font-size:14px;color:var(--navy);font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;}
.docs-note ul{margin:0;padding-left:18px;display:grid;gap:6px;}
.docs-note li{font-size:14px;color:var(--text);line-height:1.5;}

/* =====================================================================
   GALLERY
   ===================================================================== */
.gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:12px;margin-bottom:30px;}
.gallery-grid figure{margin:0;overflow:hidden;border-radius:var(--r-md);position:relative;background:var(--border);}
.gallery-grid figure:nth-child(1){grid-column:span 2;grid-row:span 2;}
.gallery-grid figure:nth-child(4){grid-column:span 2;}
.gallery-grid img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease);}
.gallery-grid figure:hover img{transform:scale(1.08);}
.video-wrap{position:relative;padding-top:56.25%;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-md);}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}

/* Reviews */
.review-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;margin-bottom:14px;}
.rev-head{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.rev-emoji{width:48px;height:48px;border-radius:50%;background:var(--light);display:grid;place-items:center;font-size:24px;flex-shrink:0;}
.rev-name{font-weight:800;color:var(--navy);font-size:15px;}
.rev-loc{font-size:12px;color:var(--muted);}
.rev-stars{margin-left:auto;color:var(--gold);letter-spacing:2px;font-size:15px;}
.rev-date{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px;}
.rev-text{font-size:15px;line-height:1.65;color:var(--text);font-style:italic;}

/* =====================================================================
   FAQ
   ===================================================================== */
.faq-list{max-width:100%;margin:0;display:block;}
.faq-item{border-radius:var(--r-sm);background:var(--white);border:1px solid var(--border);margin-bottom:12px;
  display:block;overflow:hidden;transition:border-color .3s var(--ease-soft),box-shadow .3s var(--ease-soft);}
.faq-item:hover{border-color:rgba(198,166,98,.45);box-shadow:var(--shadow-sm);}
.faq-item.open{border-color:rgba(198,166,98,.5);}
.faq-q{padding:16px 18px;font-size:15px;font-weight:700;color:var(--navy);width:100%;display:flex;
  justify-content:space-between;align-items:center;text-align:left;background:none;border:none;cursor:pointer;gap:12px;}
.faq-q .chev{transition:transform .3s var(--ease);font-size:14px;color:var(--gold2);flex-shrink:0;}
.faq-item.open .faq-q .chev{transform:rotate(180deg);}
.faq-a{max-height:0;overflow:hidden;transition:max-height .35s var(--ease),padding .35s var(--ease);
  padding:0 18px;font-size:14.5px;line-height:1.65;color:var(--text);}
.faq-item.open .faq-a{max-height:300px;padding:0 18px 18px;}

/* =====================================================================
   BOOKING CARD  (wired to real PDF pricing tiers)
   ===================================================================== */
.td-booking-card{position:sticky;top:88px;background:var(--white);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow-md);}
.bk-tag{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold2);margin-bottom:6px;}
.td-price-box{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border);}
.td-price-now{font-size:32px;font-weight:900;letter-spacing:-.5px;color:var(--navy);}
.td-price-now .cur{font-size:20px;font-weight:700;color:var(--gold2);vertical-align:top;}
.td-price-now .per{font-size:14px;font-weight:500;color:var(--muted);}
.price-tier-note{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.5;}
.price-tier-note b{color:var(--teal);}

.td-form-group{margin-bottom:16px;}
.td-form-group label{display:block;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--muted);

.td-select{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-family:inherit;font-size:16px;

.td-select:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(198,166,98,.14);}

.td-count-row{display:flex;align-items:center;justify-content:space-between;background:var(--light);

.td-count-row .cl{font-size:14px;font-weight:700;color:var(--navy);}
.td-counter{display:flex;align-items:center;gap:6px;}
.td-counter button{width:34px;height:34px;display:grid;place-items:center;background:var(--white);border:1.5px solid var(--border);
  border-radius:8px;font-size:18px;font-weight:700;color:var(--navy);cursor:pointer;line-height:1;
  transition:color .2s,border-color .2s,transform .15s var(--ease);}
.td-counter button:hover{color:var(--gold2);border-color:var(--gold);transform:scale(1.08);}
.td-counter .cval{font-family:var(--mono);min-width:30px;text-align:center;font-size:16px;font-weight:700;color:var(--navy);}

.porter-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;
  padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--white);}
.porter-row .pl{font-size:13.5px;font-weight:700;color:var(--navy);}
.porter-row .ps{font-size:11.5px;color:var(--muted);}
.switch{position:relative;width:46px;height:26px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .track{position:absolute;inset:0;background:var(--border);border-radius:999px;cursor:pointer;transition:background .25s;}
.switch .track::before{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;background:var(--white);
  border-radius:50%;transition:transform .25s var(--ease);box-shadow:0 2px 5px rgba(0,0,0,.2);}
.switch input:checked + .track{background:var(--teal);}
.switch input:checked + .track::before{transform:translateX(20px);}

.td-total-row{display:flex;justify-content:space-between;align-items:center;margin:20px 0 6px;padding-top:16px;border-top:1px dashed var(--border);}
.td-total-label{font-weight:700;color:var(--navy);font-size:15px;}
.td-total-val{font-size:24px;font-weight:900;color:var(--navy);letter-spacing:-.5px;}
.td-total-val .cur{font-size:15px;color:var(--gold2);}
.total-sub{font-size:11.5px;color:var(--muted);text-align:right;margin-bottom:16px;}

.td-book-btn{position:relative;width:100%;background:linear-gradient(120deg,var(--navy),var(--teal));color:var(--gold3);
  border:none;padding:16px;border-radius:var(--r-sm);font-size:16px;font-weight:800;letter-spacing:.3px;overflow:hidden;
  cursor:pointer;box-shadow:0 10px 24px rgba(22,48,107,.22);transition:transform .25s var(--ease),box-shadow .3s var(--ease);}
.td-book-btn::before{content:"";position:absolute;top:0;left:-120%;width:80%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.25),transparent);transform:skewX(-20deg);transition:left .6s var(--ease);}
.td-book-btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(22,48,107,.3);}

.bk-trust{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
.bk-trust div{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text);}
.bk-trust .ti{color:var(--teal);font-weight:700;}

   RESPONSIVE
   ===================================================================== */
@media(max-width:1024px){
  .td-main-layout{grid-template-columns:1fr;gap:30px;margin:44px auto;}
  .td-booking-card{position:static;margin-top:6px;}
  .trek-details-hero{height:480px;padding:50px 40px;}
  .gallery-grid{grid-template-columns:repeat(2,1fr);}

}
@media(max-width:768px){

  .td-info-strip{flex-wrap:wrap;gap:16px;padding:18px;margin-top:-34px;width:calc(100% - 40px);}

  .qi-ico{font-size:22px;}
  .td-tabs{gap:20px;overflow-x:auto;padding:14px 20px 0;margin:0 -20px 30px;white-space:nowrap;flex-wrap:nowrap;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;border-bottom:1px solid var(--border);}

  .td-t{font-size:14px;flex-shrink:0;padding:12px 2px;}
  .td-t:last-child{padding-right:30px;}
  .td-highlights-grid{grid-template-columns:1fr;}
  .ie-grid{grid-template-columns:1fr;}
  .td-text{font-size:15px;line-height:1.75;}
}
@media(max-width:600px){
  .trek-filter-bar{padding:18px 15px;}
  .treks-grid-section{padding:24px 8px;}
  .grid-layout{gap:16px;grid-template-columns:1fr;padding:0 10px;}
  .grid-count{margin:0 10px 14px;}
  .gallery-grid{grid-template-columns:1fr;grid-auto-rows:180px;}
  .gallery-grid figure:nth-child(1){grid-column:span 1;grid-row:span 1;}
  .faq-q{padding:14px 15px;font-size:14px;}
}
@media(max-width:480px){
  .all-treks-hero{height:320px;}
  .trek-details-hero{height:360px;padding:28px 16px;}
  .td-title-row h1{font-size:28px;}

  .td-price-now{font-size:28px;}
  .td-counter button{width:38px;height:38px;}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}
  html{scroll-behavior:auto;}
}

function buildFilterTabs(){
  const wrap = document.getElementById("filterTabs");
  wrap.querySelectorAll(".ftab").forEach(n => n.remove());
  FILTERS.forEach(f => {
    const b = document.createElement("button");
    b.className = "ftab" + (f === activeFilter ? " active" : "");
    b.textContent = f;
    b.onclick = () => { activeFilter = f; buildFilterTabs(); renderGrid(); };
    wrap.appendChild(b);
  });
}

/* =====================================================================
   RENDER GRID
   ===================================================================== */
function priceLabel(t){
  if (t.pricing){
    const min = Math.min(...t.pricing.tiers.map(x => x.price));
    return `<span>from</span> <b>${rupee(min)}</b> <span>/ person</span>`;
  }
  if (t.priceFrom) return `<span>from</span> <b>${rupee(t.priceFrom)}</b> <span>/ person</span>`;
  return `<span class="req">On request</span>`;
}

function renderGrid(){
  const q = (document.getElementById("trekSearch").value || "").toLowerCase().trim();
  const grid = document.getElementById("gridLayout");
  grid.innerHTML = "";
  const entries = Object.entries(TREKS).filter(([k, t]) => {
    const matchFilter = activeFilter === "All" || t.country === activeFilter;
    const hay = (t.title + " " + t.region + " " + t.diff).toLowerCase();
    return matchFilter && hay.includes(q);
  });

  document.getElementById("gridCount").innerHTML =
    `Showing <b>${entries.length}</b> ${entries.length === 1 ? "trek" : "treks"}` +
    (activeFilter !== "All" ? ` in ${activeFilter}` : "");

  if (!entries.length){
    grid.innerHTML = `<div class="no-results-msg" style="grid-column:1/-1">
      <div class="no-res-ico">🏔</div>
      <h3>No treks match that</h3>
      <p>Try a different region filter, or clear your search to see everything.</p></div>`;
    return;
  }

  entries.forEach(([key, t], i) => {
    const card = document.createElement("div");
    card.className = "trek-card";
    card.style.animation = `atRise .5s var(--ease) ${i * 0.05}s both`;
    card.onclick = () => openTrek(key);
    card.innerHTML = `
      <div class="tk-img">
        <img src="${t.img}" alt="${t.title}" loading="lazy"
             onerror="this.src='https://images.unsplash.com/photo-1544735716-392fe2489ffa?q=80&w=1470&auto=format&fit=crop'">
        <span class="tk-diff">${t.diff}</span>
        <span class="tk-loc">📍 ${t.region}</span>
      </div>
      <div class="tk-body">
        <h3 class="tk-title">${t.title}</h3>
        <div class="tk-meta">
          <div><span class="k">Duration</span><span class="v">${t.dur.split(" /")[0]}</span></div>
          <div><span class="k">Max Altitude</span><span class="v">${t.alt}</span></div>
          <div><span class="k">Best Season</span><span class="v">${t.season}</span></div>
          <div><span class="k">Distance</span><span class="v">${t.dist}</span></div>
        </div>
        <div class="tk-price">${priceLabel(t)}</div>
        <button class="tk-btn">View Trek →</button>
      </div>`;
    grid.appendChild(card);
  });
}

/* =====================================================================
   ALTITUDE RIDGELINE  (the signature)
   ===================================================================== */
function buildAltitudeSVG(itin){
  const W = 900, H = 230, padL = 44, padR = 20, padT = 22, padB = 34;
  const alts = itin.map(d => d.alt);
  const maxA = Math.max(...alts), minA = Math.min(...alts);
  const niceMax = Math.ceil(maxA / 1000) * 1000;
  const niceMin = Math.floor(minA / 1000) * 1000;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const x = i => padL + (plotW * i) / (itin.length - 1);
  const y = a => padT + plotH * (1 - (a - niceMin) / (niceMax - niceMin));

  // gridlines every 1000 m
  let grid = "";
  for (let a = niceMin; a <= niceMax; a += 1000){
    grid += `<line class="alt-grid-line" x1="${padL}" y1="${y(a).toFixed(1)}" x2="${W - padR}" y2="${y(a).toFixed(1)}"/>`;
    grid += `<text class="alt-grid-label" x="6" y="${(y(a) + 3).toFixed(1)}">${(a/1000).toFixed(0)}k</text>`;
  }

  const linePts = itin.map((d, i) => `${x(i).toFixed(1)},${y(d.alt).toFixed(1)}`).join(" ");
  const areaPts = `${padL},${(H - padB).toFixed(1)} ${linePts} ${(W - padR).toFixed(1)},${(H - padB).toFixed(1)}`;

  const peakIdx = alts.indexOf(maxA);
  let dots = "", labels = "";
  itin.forEach((d, i) => {
    const isPeak = i === peakIdx;
    dots += `<circle class="alt-dot${isPeak ? " peak" : ""}" data-day="${d.day}" cx="${x(i).toFixed(1)}" cy="${y(d.alt).toFixed(1)}" r="${isPeak ? 6 : 4.5}">
      <title>Day ${d.day} · ${d.title} · sleep ${d.alt.toLocaleString("en-IN")} m</title></circle>`;
    if (i % 2 === 0 || isPeak)
      labels += `<text class="alt-daylabel" x="${x(i).toFixed(1)}" y="${H - 12}">D${d.day}</text>`;
  });

  return `<svg class="alt-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Altitude profile of the trek by day">
    <defs><linearGradient id="altGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3cd94" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#e3cd94" stop-opacity="0.02"/>
    </linearGradient></defs>
    ${grid}
    <polygon class="alt-area" points="${areaPts}"/>
    <polyline class="alt-line" points="${linePts}"/>
    ${dots}${labels}
  </svg>`;
}

/* =====================================================================
   PANEL BUILDERS
   ===================================================================== */
function stars(n){ return "★".repeat(n) + "☆".repeat(5 - n); }

function buildOverview(t){
  return `
    <h2 class="td-section-title"><span class="num">01</span> About this trek</h2>
    <p class="td-text">${t.about}</p>
    <div class="td-callout">
      <span class="ci">🗓</span>
      <div class="ct"><b>Best time to go.</b> ${t.bestTime}</div>
    </div>
    <h2 class="td-section-title"><span class="num">02</span> Trip highlights</h2>
    <div class="td-highlights-grid">
      ${t.highlights.map(h => {
        const sp = h.indexOf(" ");
        return `<div class="tdh-item"><span class="tdh-ico">${h.slice(0, sp)}</span><span class="tdh-txt">${h.slice(sp + 1)}</span></div>`;
      }).join("")}
    </div>
    <h2 class="td-section-title"><span class="num">03</span> What to carry</h2>
    <div class="td-carry">
      ${t.carry.map(c => `<span class="carry-chip"><span class="dot"></span>${c}</span>`).join("")}
    </div>`;
}

function buildItinerary(t){
  const peakM = Math.max(...t.itinerary.map(d => d.alt));
  return `
    <div class="altitude-card">
      <div class="alt-head">
        <div>
          <h3>Altitude profile</h3>
          <div class="sub">Sleeping elevation · day by day</div>
        </div>
        <div class="alt-peak">
          <div class="pv">${t.alt}</div>
          <div class="pl">highest point${t.altNote ? " · " + t.altNote : ""}</div>
        </div>
      </div>
      <div class="alt-svg-wrap">${buildAltitudeSVG(t.itinerary)}</div>
      <div class="alt-legend">
        <span><i></i> Sleeping altitude</span>
        <span><i class="peak"></i> Highest point</span>
        <span>Watch the two plateaus — those are your acclimatization days.</span>
      </div>
    </div>
    <h2 class="td-section-title"><span class="num">${String(t.itinerary.length)}</span> Day-by-day</h2>
    <div class="itin">
      ${t.itinerary.map(d => `
        <div class="itin-item ${d.rest ? "rest" : ""}" data-day="${d.day}"
             onmouseenter="hotDay(${d.day},true)" onmouseleave="hotDay(${d.day},false)">
          <div class="itin-node">${d.day}</div>
          <div class="itin-card">
            <div class="itin-top">
              <div class="itin-title">${d.title}</div>
              <div class="itin-badges">
                ${d.rest ? `<span class="itin-badge rest">REST</span>` : ""}
                ${d.time ? `<span class="itin-badge time">${d.time}</span>` : ""}
                <span class="itin-badge alt">${d.sub}</span>
              </div>
            </div>
            <ul class="itin-points">${d.points.map(p => `<li>${p}</li>`).join("")}</ul>
          </div>
        </div>`).join("")}
    </div>`;
}

function hotDay(day, on){
  document.querySelectorAll(`.alt-dot[data-day="${day}"]`).forEach(d => d.classList.toggle("hot", on));
}

function buildInclusions(t){
  return `
    <div class="ie-grid">
      <div class="ie-col inc">
        <h4><span class="badge">✓</span> What's included</h4>
        <ul class="ie-list">${t.includes.map(i => `<li>${i}</li>`).join("")}</ul>
      </div>
      <div class="ie-col exc">
        <h4><span class="badge">✕</span> Not included</h4>
        <ul class="ie-list">${t.excludes.map(i => `<li>${i}</li>`).join("")}</ul>
      </div>
    </div>
    <div class="docs-note">
      <h5>📄 Documents required to book</h5>
      <ul>${(t.documents || []).map(d => `<li>${d}</li>`).join("")}</ul>
    </div>`;
}

function buildGallery(t){
  const vid = t.videos && t.videos[0]
    ? `<div class="video-wrap"><iframe src="https://www.youtube.com/embed/${t.videos[0]}" title="Trek video" allowfullscreen loading="lazy"></iframe></div>`
    : "";
  return `
    <h2 class="td-section-title"><span class="num">📷</span> Gallery</h2>
    <div class="gallery-grid">
      ${t.photos.map(p => `<figure><img src="${p}" alt="${t.title}" loading="lazy"
         onerror="this.parentElement.style.display='none'"></figure>`).join("")}
    </div>
    ${vid}`;
}

function buildReviews(t){
  return `
    <h2 class="td-section-title"><span class="num">★</span> Trekker reviews</h2>
    ${(t.reviews || []).map(r => `
      <div class="review-card">
        <div class="rev-head">
          <div class="rev-emoji">${r.e}</div>
          <div>
            <div class="rev-name">${r.name}</div>
            <div class="rev-loc">📍 ${r.loc}</div>
          </div>
          <div style="margin-left:auto;text-align:right">
            <div class="rev-stars">${stars(r.r)}</div>
            <div class="rev-date">${r.date}</div>
          </div>
        </div>
        <p class="rev-text">"${r.text}"</p>
      </div>`).join("")}`;
}

function buildFaq(t){
  return `
    <h2 class="td-section-title"><span class="num">?</span> Frequently asked</h2>
    <div class="faq-list">
      ${(t.faqs || []).map((f, i) => `
        <div class="faq-item ${i === 0 ? "open" : ""}">
          <button class="faq-q" onclick="toggleFaq(this)">${f.q}<span class="chev">▾</span></button>
          <div class="faq-a">${f.a}</div>
        </div>`).join("")}
    </div>`;
}

function toggleFaq(btn){ btn.closest(".faq-item").classList.toggle("open"); }

/* =====================================================================
   BOOKING CARD  (real tiered pricing for EBC)
   ===================================================================== */
let bookingState = { pax: 2, porter: false, trek: null };

function tierPrice(t, pax){
  if (t.pricing){
    const tier = t.pricing.tiers.find(x => pax >= x.min && pax <= x.max) || t.pricing.tiers[t.pricing.tiers.length - 1];
    return tier.price;
  }
  return t.priceFrom || null;
}

function buildBookingCard(t){
  bookingState = { pax: 2, porter: false, trek: t };
  const hasPrice = !!(t.pricing || t.priceFrom);
  const datesOpts = t.dates.map(d => `<option>${d}</option>`).join("");

  let priceBlock;
  if (t.pricing){
    priceBlock = `
      <div class="bk-tag">Per person · group pricing</div>
      <div class="td-price-now"><span class="cur">₹</span><span id="ppPrice"></span> <span class="per">/ person</span></div>
      <div class="price-tier-note" id="tierNote"></div>`;
  } else if (t.priceFrom){
    priceBlock = `
      <div class="bk-tag">Per person · indicative</div>
      <div class="td-price-now"><span class="cur">₹</span>${t.priceFrom.toLocaleString("en-IN")} <span class="per">/ person</span></div>
      <div class="price-tier-note">Final quote confirmed on group size & season.</div>`;
  } else {
    priceBlock = `<div class="bk-tag">Custom trip</div><div class="td-price-now" style="font-size:24px">On request</div>`;
  }

  const porterRow = t.pricing ? `
    <div class="porter-row">
      <div><div class="pl">Add porter support</div><div class="ps">${rupee(t.pricing.porter)}/person · 1 porter per 2 trekkers</div></div>
      <label class="switch"><input type="checkbox" id="porterToggle" onchange="updateBooking()"><span class="track"></span></label>
    </div>` : "";

  const card = `
    <div class="td-price-box">${priceBlock}</div>
    <div class="td-form-group">
      <label>Choose a departure</label>
      <select class="td-select">${datesOpts}</select>
    </div>
    <div class="td-form-group">
      <label>Trekkers</label>
      <div class="td-count-row">
        <span class="cl">Group size</span>
        <div class="td-counter">
          <button onclick="changePax(-1)" aria-label="Fewer trekkers">−</button>
          <span class="cval" id="paxVal">2</span>
          <button onclick="changePax(1)" aria-label="More trekkers">+</button>
        </div>
      </div>
    </div>
    ${porterRow}
    <div class="td-total-row">
      <span class="td-total-label">Total</span>
      <span class="td-total-val"><span class="cur">₹</span><span id="totalVal"></span></span>
    </div>
    <div class="total-sub" id="totalSub"></div>
    <button class="td-book-btn">${hasPrice ? "Reserve your spot" : "Request a quote"}</button>
    <div class="bk-trust">
      <div><span class="ti">✓</span> Free date changes up to 30 days out</div>
      <div><span class="ti">✓</span> Certified guides · porter welfare covered</div>
      <div><span class="ti">✓</span> Non-refundable advance confirms your booking</div>
    </div>`;

  document.getElementById("bookingCard").innerHTML = card;
  updateBooking();
}

function changePax(delta){
  bookingState.pax = Math.max(1, Math.min(20, bookingState.pax + delta));
  document.getElementById("paxVal").textContent = bookingState.pax;
  updateBooking();
}

function updateBooking(){
  const t = bookingState.trek;
  if (!t) return;
  const porterEl = document.getElementById("porterToggle");
  bookingState.porter = porterEl ? porterEl.checked : false;
  const pax = bookingState.pax;

  const pp = tierPrice(t, pax);
  const ppEl = document.getElementById("ppPrice");
  if (ppEl && t.pricing){
    ppEl.textContent = pp.toLocaleString("en-IN");
    const tier = t.pricing.tiers.find(x => pax >= x.min && pax <= x.max);
    document.getElementById("tierNote").innerHTML =
      `You're in the <b>${tier ? tier.label : ""}</b> band. Bigger groups pay less — from ₹60,000 at 15+.`;
  }

  if (pp == null){
    const tv = document.getElementById("totalVal");
    if (tv) tv.textContent = "—";
    return;
  }
  let total = pp * pax;
  let subParts = [`${rupee(pp)} × ${pax}`];
  if (bookingState.porter && t.pricing){
    const porter = t.pricing.porter * pax;
    total += porter;
    subParts.push(`porter ${rupee(t.pricing.porter)} × ${pax}`);
  }
  document.getElementById("totalVal").textContent = total.toLocaleString("en-IN");
  const sub = document.getElementById("totalSub");
  if (sub) sub.textContent = subParts.join("  ·  ");
}

/* =====================================================================
   OPEN / SWITCH VIEWS
   ===================================================================== */
function openTrek(key){
  const t = TREKS[key];
  if (!t) return;

  document.getElementById("tdHero").style.backgroundImage =
    `linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.1)),url("${t.photos[0] || t.img}")`;
  document.getElementById("bcTitle").textContent = t.title;
  document.getElementById("tdTitle").textContent = t.title;
  document.getElementById("tdRegion").innerHTML = `📍 ${t.region}`;

  document.getElementById("tdHeroTags").innerHTML = `
    <span class="td-hero-tag gold">${t.diff}</span>
    <span class="td-hero-tag">${t.dur.split(" /")[0]}</span>
    <span class="td-hero-tag">Season · ${t.season}</span>`;

  const strip = [
    ["🗓", "Duration", t.dur.split(" /")[0]],
    ["⛰", "Max Altitude", t.alt],
    ["🥾", "Difficulty", t.diff.split(" ")[0]],
    ["🌤", "Best Season", t.season],
    ["📏", "Distance", t.dist],
    ["🚩", "Start / End", t.startEnd]
  ];
  document.getElementById("tdInfoStrip").innerHTML = strip.map(([ic, l, v]) => `
    <div class="td-qi"><div class="qi-ico">${ic}</div>
      <div><div class="qi-label">${l}</div><div class="qi-val">${v}</div></div></div>`).join("");

  document.getElementById("panel-overview").innerHTML   = buildOverview(t);
  document.getElementById("panel-itinerary").innerHTML  = buildItinerary(t);
  document.getElementById("panel-inclusions").innerHTML = buildInclusions(t);
  document.getElementById("panel-gallery").innerHTML    = buildGallery(t);
  document.getElementById("panel-reviews").innerHTML    = buildReviews(t);
  document.getElementById("panel-faq").innerHTML        = buildFaq(t);
  buildBookingCard(t);

  // reset to first tab
  document.querySelectorAll(".td-t").forEach((b, i) => b.classList.toggle("active", i === 0));
  document.querySelectorAll(".td-panel").forEach((p, i) => p.classList.toggle("active", i === 0));

  document.getElementById("gridView").classList.remove("active");
  document.getElementById("detailView").classList.add("active");
  window.scrollTo({ top: 0, behavior: "auto" });
}

function showGrid(){
  document.getElementById("detailView").classList.remove("active");
  document.getElementById("gridView").classList.add("active");
  window.scrollTo({ top: 0, behavior: "auto" });
}

/* tab switching */
document.getElementById("tdTabs").addEventListener("click", e => {
  const btn = e.target.closest(".td-t");
  if (!btn) return;
  document.querySelectorAll(".td-t").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  const p = btn.dataset.p;
  document.querySelectorAll(".td-panel").forEach(pan => pan.classList.remove("active"));
  document.getElementById("panel-" + p).classList.add("active");
});

/* init */
buildFilterTabs();
renderGrid();
</script>
